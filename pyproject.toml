[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-agent-workbench"
version = "0.1.0"
description = "An evidence-grounded, versioned decision workflow for reviewing synthetic commercial-risk cases with traceable rules, missing-evidence checks, and calibrated evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Asher"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["risk_agent_workbench*"]
